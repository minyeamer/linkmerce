[project]
name = "linkmerce"
version = "1.1.0"
description = "E-commerce API integration management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "bcrypt>=5.0.0",
    "brotli>=1.2.1",
    "bs4>=0.0.2",
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "nest-asyncio>=1.6.0",
    "openpyxl>=3.1.5",
    "pycryptodome>=4.6.0",
    "pytz>=2026.6",
    "requests>=2.34.2",
    "ruamel-yaml==0.18.14",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "linkmerce"
module-root = "src"
